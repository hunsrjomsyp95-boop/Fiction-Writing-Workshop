appId: com.novelstudio.writer
productName: 小说创作工坊
copyright: Copyright © 2026

directories:
  output: release-ia32

files:
  - dist/**
  - electron/**
  - package.json

asar: true
asarUnpack:
  - "**/node_modules/better-sqlite3/**"

npmRebuild: true
buildDependenciesFromSource: false

win:
  target:
    - target: nsis
      arch:
        - ia32
    - target: portable
      arch:
        - ia32

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: true
  shortcutName: 小说创作工坊
  deleteAppDataOnUninstall: false
  runAfterFinish: false
  installerIcon: ""
  uninstallerIcon: ""
  include: "installer.nsh"
  license: ""
  warningsAsErrors: false

electronLanguages:
  - zh-CN
  - en-US
