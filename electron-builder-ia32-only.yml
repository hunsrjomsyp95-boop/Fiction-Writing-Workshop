appId: com.novelstudio.writer
productName: 小说创作工坊
copyright: Copyright © 2026

publish:
  provider: github
  owner: hunsrjomsyp95-boop
  repo: Fiction-Writing-Workshop
  releaseType: release

directories:
  output: release-ia32

artifactName: "${productName} Setup ${version} ${arch}.${ext}"

files:
  - dist/**
  - electron/**
  - package.json
  - CHANGELOG.md
  - "!node_modules/**/{test,tests,__tests__,example,examples,doc,docs,markdown}/**"
  - "!node_modules/**/*.{md,txt,map,ts}"

asar: true
asarUnpack:
  - "**/node_modules/better-sqlite3/**"

npmRebuild: false
buildDependenciesFromSource: false
nodeGypRebuild: false
forceCodeSigning: false

win:
  target:
    - target: nsis
      arch:
        - ia32
    - target: portable
      arch:
        - ia32

portable:
  artifactName: "${productName} ${version} ${arch} Portable.${ext}"

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: true
  shortcutName: 小说创作工坊
  deleteAppDataOnUninstall: false
  runAfterFinish: false
  installerIcon: ""
  uninstallerIcon: ""
  include: "installer.nsh"
  license: "LICENSE"
  warningsAsErrors: false

electronLanguages:
  - zh-CN
  - en-US